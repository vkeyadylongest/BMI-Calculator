<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>BMI Calculator</h1>
    <p class="subtitle">Enter your weight and height</p>

    <label for="weight">Weight (kg)</label>
    <input type="number" id="weight" placeholder="e.g. 70">

    <label for="height">Height (cm)</label>
    <input type="number" id="height" placeholder="e.g. 175">

    <button onclick="calculate()">Calculate BMI</button>

    <!-- Shown only when the input is wrong -->
    <p id="error" class="error hidden"></p>

    <!-- Shown only after a successful calculation -->
    <div id="results" class="results hidden">
      <p class="label">Your BMI</p>
      <p id="bmiText" class="bmi"></p>

      <p id="categoryText" class="category"></p>
      <p id="healthyText" class="healthy-text"></p>
    </div>

    <p class="disclaimer">
      BMI is a screening tool, not a medical diagnosis.
      Talk to a health professional for advice.
    </p>
  </div>

  <!-- Script goes at the bottom so the elements above already exist -->
  <script src="script.js"></script>
</body>
</html>
